[platformio]
default_envs = esp32dev

[env]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 230400
upload_speed = 115200
build_flags = -Wall -Wextra

[env:esp32dev]
build_src_filter = +<imu.cpp> +<main.cpp> +<lcd_ui.cpp> +<macro_engine.cpp> +<modes.cpp> +<menu.cpp> +<gesture_engine.cpp>

[env:dataset]
build_src_filter = +<imu.cpp> +<dataset_main.cpp> +<capture_protocol.cpp> +<lcd_ui.cpp> +<menu.cpp> +<gesture_engine.cpp>
